<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stamp</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="field"></canvas>
  <div class="wrap">
    <h1>stamp</h1>
    <p>Paste a unix time or an ISO date.</p>
    <section class="panel">
      <textarea id="text" placeholder="input"></textarea>
      
      <button id="go" type="button">Run</button>
      <pre id="out" class="out"></pre>
    </section>
  </div>
  <script src="/field.js"></script>
  <script src="/app.js"></script>
</body>
</html>
